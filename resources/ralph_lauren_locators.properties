# Ralph Lauren Website Locators
# This file contains realistic locators for Ralph Lauren website elements
# Note: These are based on common e-commerce patterns and may need adjustment

# Homepage Elements - Navigation
main.navigation=css=nav[role='navigation'], css=.main-navigation, css=header nav
men.link=css=a[href*='men'], css=.men-category, css=a:contains('Men')
women.link=css=a[href*='women'], css=.women-category, css=a:contains('Women')
kids.link=css=a[href*='kids'], css=.kids-category, css=a:contains('Kids')
home.link=css=a[href='/'], css=.home-link, css=a:contains('Home')

# Search Elements
search.input=css=input[type='search'], css=.search-input, css=input[placeholder*='search']
search.button=css=button[type='submit'], css=.search-button, css=button:contains('Search')

# Product Grid and Links
product.grid=css=.product-grid, css=.products-grid, css=[class*='product-grid']
product.link=css=a[href*='product'], css=.product-link, css=.product-item a
product.item=css=.product-item, css=.product-tile, css=[class*='product-item']

# Cookie Consent
accept.cookies=css=button:contains('Accept'), css=.accept-cookies, css=button[class*='accept']
reject.cookies=css=button:contains('Reject'), css=.reject-cookies, css=button[class*='reject']

# Product Detail Page Elements
product.title=css=h1, css=.product-title, css=[class*='product-title']
product.price=css=.price, css=[class*='price'], css=.product-price
product.description=css=.product-description, css=[class*='description']
product.images=css=.product-images, css=[class*='product-image']

# Size and Color Selection
size.selector=css=.size-selector, css=[class*='size-selector'], css=.size-options
size.option=css=button[class*='size'], css=.size-option, css=input[type='radio'][name*='size']
color.selector=css=.color-selector, css=[class*='color-selector'], css=.color-options
color.option=css=button[class*='color'], css=.color-option, css=input[type='radio'][name*='color']

# Add to Cart and Wishlist
add.to.cart=css=button:contains('Add to Cart'), css=.add-to-cart, css=button[class*='add-cart']
add.to.wishlist=css=button:contains('Wishlist'), css=.add-to-wishlist, css=button[class*='wishlist']

# Quantity Selection
quantity.selector=css=select[name*='quantity'], css=.quantity-selector
quantity.input=css=input[name*='quantity'], css=.quantity-input

# Product Details
product.details=css=.product-details, css=[class*='product-details']
size.chart=css=.size-chart, css=[class*='size-chart']
shipping.info=css=.shipping-info, css=[class*='shipping']
breadcrumb=css=.breadcrumb, css=nav[aria-label='breadcrumb']
related.products=css=.related-products, css=[class*='related']

# Common Elements
main.header=css=header, css=.main-header, css=[role='banner']
main.footer=css=footer, css=.main-footer, css=[role='contentinfo']
cookie.accept=css=button:contains('Accept All'), css=button:contains('Accept Cookies')
cookie.reject=css=button:contains('Reject All'), css=button:contains('Reject Cookies')

# Alternative locators for different page structures
alt.product.title=css=h1.product-title, css=h1[class*='product-title'], css=.product-title h1
alt.product.price=css=.price, css=[class*='price'], css=.product-price
alt.add.to.cart=css=button[class*='add-to-cart'], css=.add-to-cart, css=button[class*='add-cart']
alt.size.selector=css=.size-selector, css=[class*='size-selector'], css=.size-options
alt.color.selector=css=.color-selector, css=[class*='color-selector'], css=.color-options

# Search and Navigation
search.results=css=.search-results, css=[class*='search-results']
product.list=css=.product-list, css=[class*='product-list']
product.item=css=.product-item, css=[class*='product-item']
product.image=css=.product-image, css=[class*='product-image']

# Category Navigation
category.men=css=a[href*='men'], css=.men-category, css=[class*='men']
category.women=css=a[href*='women'], css=.women-category, css=[class*='women']
category.kids=css=a[href*='kids'], css=.kids-category, css=[class*='kids']

# Product Grid
product.grid.container=css=.product-grid, css=[class*='product-grid']
product.tile=css=.product-tile, css=[class*='product-tile']
product.link.alt=css=a[href*='product'], css=.product-link, css=[class*='product-link']