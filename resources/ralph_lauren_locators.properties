# Ralph Lauren Website Locators
# This file contains all the locators for Ralph Lauren website elements

# Homepage Elements
main.navigation=css=nav[data-testid='main-navigation']
men.link=css=a[data-testid='men-link']
women.link=css=a[data-testid='women-link']
kids.link=css=a[data-testid='kids-link']
home.link=css=a[data-testid='home-link']
search.input=css=input[data-testid='search-input']
search.button=css=button[data-testid='search-button']
product.grid=css=div[data-testid='product-grid']
product.link=css=a[data-testid='product-link']
accept.cookies=css=button[data-testid='accept-cookies']
reject.cookies=css=button[data-testid='reject-cookies']

# Product Detail Page Elements
product.title=css=h1[data-testid='product-title']
product.price=css=span[data-testid='product-price']
product.description=css=div[data-testid='product-description']
product.images=css=div[data-testid='product-images']
size.selector=css=div[data-testid='size-selector']
size.option=css=button[data-testid='size-option']
color.selector=css=div[data-testid='color-selector']
color.option=css=button[data-testid='color-option']
add.to.cart=css=button[data-testid='add-to-cart']
add.to.wishlist=css=button[data-testid='add-to-wishlist']
quantity.selector=css=select[data-testid='quantity-selector']
quantity.input=css=input[data-testid='quantity-input']
product.details=css=div[data-testid='product-details']
size.chart=css=div[data-testid='size-chart']
shipping.info=css=div[data-testid='shipping-info']
breadcrumb=css=nav[data-testid='breadcrumb']
related.products=css=div[data-testid='related-products']

# Common Elements
main.header=css=header[data-testid='main-header']
main.footer=css=footer[data-testid='main-footer']
cookie.accept=css=button[data-testid='cookie-accept']
cookie.reject=css=button[data-testid='cookie-reject']

# Alternative locators for different page structures
alt.product.title=css=h1.product-title, css=h1[class*='product-title'], css=.product-title h1
alt.product.price=css=.price, css=[class*='price'], css=.product-price
alt.add.to.cart=css=button[class*='add-to-cart'], css=.add-to-cart, css=button[class*='add-cart']
alt.size.selector=css=.size-selector, css=[class*='size-selector'], css=.size-options
alt.color.selector=css=.color-selector, css=[class*='color-selector'], css=.color-options

# Search and Navigation
search.results=css=.search-results, css=[class*='search-results']
product.list=css=.product-list, css=[class*='product-list']
product.item=css=.product-item, css=[class*='product-item']
product.image=css=.product-image, css=[class*='product-image']

# Category Navigation
category.men=css=a[href*='men'], css=.men-category, css=[class*='men']
category.women=css=a[href*='women'], css=.women-category, css=[class*='women']
category.kids=css=a[href*='kids'], css=.kids-category, css=[class*='kids']

# Product Grid
product.grid.container=css=.product-grid, css=[class*='product-grid']
product.tile=css=.product-tile, css=[class*='product-tile']
product.link.alt=css=a[href*='product'], css=.product-link, css=[class*='product-link']